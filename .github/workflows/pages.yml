name: pages

# catalog.json is regenerated by scout-publish-bot with a "[skip ci]" commit, which
# suppresses ALL push-triggered workflows on that commit — so a push trigger on
# catalog.json would never fire. The daily schedule picks up those version bumps
# instead; the push trigger covers the generator, the workflow, and skill edits.
on:
  push:
    branches: [main]
    paths:
      - "scripts/gen_showcase.py"
      - "plugins/**/SKILL.md"
      - "showcase/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 6 * * *"   # daily — catches [skip ci] catalog bumps
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate showcase from catalog.json
        run: python3 scripts/gen_showcase.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - id: deploy
        uses: actions/deploy-pages@v4
