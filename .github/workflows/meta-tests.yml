name: meta-tests
# `save_result` writes the record `eval-gate` reads, so a defect here un-ships a skill without
# touching the skill. It carried one sibling key forward by name and dropped the rest, which
# deleted the cerberus security walk on every re-measurement.
on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/meta/**"

permissions:
  contents: read

jobs:
  meta-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the skill-eval save-result test
        run: python3 plugins/meta/tests/save-result.test.py
