schema-version: 1
category: quality
purpose: Agent judgment pass that reviews a skill/reference/script/eval change for anything pointing to a real work codebase — secrets, real people/emails/paths, employer or client brand, real namespace/object names, or the aggregate "one company's product" flavor — and rewrites it to a neutral fictional demo.
best-for: Any contributor to this public skills marketplace, right before committing a new or edited skill, reference, or eval fixture — also triggered automatically by the cerberus PostToolUse hook on skill edits.
needs: []
changes:
  tags: [files]
  notes: An agent judgment pass; rewrites the reviewed skill/reference/eval in place to replace a leaked real identifier with a neutral fictional demo. No network, no org, no money.
