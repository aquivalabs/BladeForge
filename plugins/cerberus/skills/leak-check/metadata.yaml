schema-version: 1
category: quality
purpose: Agent judgment pass that reviews a skill/reference/script/eval change — and, before a push, the outgoing commits' messages, authors, committers and branch name — for anything pointing to a real work codebase (secrets, real people/emails/paths, employer or client brand, real namespace/object names, or the aggregate "one company's product" flavor) and rewrites it to a neutral fictional demo.
best-for: Any contributor to this public skills marketplace, right before committing or pushing a new or edited skill, reference, or eval fixture — also triggered automatically by the cerberus PostToolUse hook on skill edits, and asked for by the cerberus push guard when it blocks a push.
needs: []
changes:
  tags: [files, git]
  notes: An agent judgment pass; rewrites the reviewed skill/reference/eval in place to replace a leaked real identifier with a neutral fictional demo. Before a push it may also rewrite the user's own unpushed commits — amend or reword a message, reset a work-account author, rename the branch — each after saying so. No network, no org, no money.
