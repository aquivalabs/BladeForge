schema-version: 1
category: docs
purpose: Turn one feature's spec, plan, code or ticket into an honest presentation film in Claude Motion, built from a reviewed storyboard.
best-for: Authors who need stakeholders to understand why a feature exists, see one real request go through it, and know what is proven and what is still open — without a promo or a slide deck.
needs: []
changes:
  tags: [files, network, other]
  notes: Creates and fills a private Claude Motion artifact on claude.ai through the Artifact and ArtifactData tools (network, and an outward-facing publish the user later chooses to share). Writes a work folder (storyboard, scene files, built documents, shot frames) and runs headless Chrome locally; the preview loads fonts from Google Fonts. It does not touch git, an org, or money.
