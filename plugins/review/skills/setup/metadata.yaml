schema-version: 1
purpose: Install and tailor the pre-push review framework (seven reviewer agents, five enabled by default, /review, secret-scan + attestation gate) into a target repo.
best-for: A repo that has the review plugin enabled but no .claude/review.config.json yet, and wants the pre-push review gate adopted and tuned to its stack — including deciding which of the seven bundled lenses it has a subject for.
needs: []
changes:
  tags: [files, network]
  notes: >
    Walks the adopter through running bootstrap.sh/install.sh (fetched via `gh api` over the
    network), which write .husky/pre-push, .github/workflows/review-gate.yml, the config schema, and
    a seeded .claude/review.config.json into the target repo, and merge the marketplace + plugin
    entry into the repo's committed .claude/settings.json. No harness is vendored — the gate is the
    published bladeforge-review-harness npm package, run via `npx …@latest`. The skill itself then
    hand-edits .claude/review.config.json (skills/rules/pairedDocs/extensionSkill) to tailor it to the project.
