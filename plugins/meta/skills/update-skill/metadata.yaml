schema-version: 1
purpose: Bring an existing skill up to the house standard — contract, boundary, checking loop, acceptance criteria — and refresh its metadata.yaml when only the wiring changed.
best-for: Any marketplace with skills written before a standard existed, where each one must be reworked without re-scaffolding it from scratch.
needs: [meta:new-skill, meta:skill-eval]
changes:
  tags: [files]
  notes: Rewrites the edited skill's SKILL.md, metadata.yaml and evals/ on disk, and edits README.md and the owning plugin.json version.
